name: Genera serpente dei contributi

on:
  schedule:
    - cron: "0 3 * * *"   # ogni notte alle 03:00 UTC
  workflow_dispatch:       # avvio manuale dalla tab Actions

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#FF9A1F&color_dots=#161b22,#0b3a66,#1E6FFF,#33b5ff,#00D9FF

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
